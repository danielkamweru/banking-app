services:
  - type: web
    name: banking-app-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker app.main:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: banking-app-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_CC_LIST
        value: Ashley.mararo@student.moringaschool.com,david.kuron@student.moringaschool.com,yvonne.kadenyi@student.moringaschool.com,daniel.kamweru@student.moringaschool.com,thomas.mbula@student.moringaschool.com

databases:
  - name: banking-app-db
    databaseName: banking_app
    user: banking_user